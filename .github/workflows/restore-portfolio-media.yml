name: Restore original portfolio media
on:
  push:
    branches: [deploy/portfolio-sites-v29]
    paths: ['.portfolio-transfer/**']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/portfolio-sites-v29
      - name: Reassemble and verify original bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = [Path('.portfolio-transfer/airship-city.part1'), Path('.portfolio-transfer/airship-city.part2')]
          content = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(content).hexdigest() == '191c58cf933053b5f99de1e985f93651fc7f74674eb03a0eea639c76dc10a455'
          Path('assets/gameplay-web/airship-city.mp4').write_bytes(content)
          for p in parts:
              p.unlink()
          PY
      - name: Commit verified original media on transfer branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gameplay-web/airship-city.mp4 .portfolio-transfer
          git commit -m 'Restore original Airship City media after verified transfer'
          git push origin HEAD:deploy/portfolio-sites-v29
